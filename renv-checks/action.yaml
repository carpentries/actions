name: 'renv-checks'
description: 'Action to check if a repository is using renv and to generate a hashsum of the lockfile'
author: 'Robert P. Davey'
inputs:
  WORKBENCH_TAG:
    description: 'Override Workbench version tag, e.g. "v0.15.0" or "latest". Defaults to "latest".'
    required: false
    default: 'latest'
  CACHE_VERSION:
    description: 'Optional renv cache version override'
    required: false
    default: ''
  skip-cache-check:
    description: 'Skip checking for cache availability and just report if renv is needed'
    required: false
    default: false
    type: boolean
  token:
    description: "GitHub PAT, usually passed as 'secrets.GITHUB_TOKEN' from the caller workflow. Required if skip-cache-check is false."
    required: false
outputs:
  renv-needed:
    description: 'Is renv needed?'
    value: ${{ steps.check-for-renv.outputs.renv-exists }}
  renv-cache-hashsum:
    description: 'renv cache hashsum'
    value: ${{ steps.set-renv-hash.outputs.renv-cache-hashsum }}
  dependency-image-ref:
    description: 'Dependency image reference selected for this repository and lockfile state'
    value: ${{ steps.resolve-dependency-image.outputs.dependency-image-ref }}
  dependency-image-available:
    description: 'Whether a repository-scoped dependency image exists in GHCR'
    value: ${{ steps.resolve-dependency-image.outputs.dependency-image-available }}


runs:
  using: "composite"
  steps:
    - name: "Checkout Lesson"
      uses: actions/checkout@v6

    - name: "Check for renv"
      id: check-for-renv
      run: |
        # Checking if renv is used #
        if [[ -d renv ]]; then
          echo "✅ renv requirement found."
          echo "renv-exists=true" >> $GITHUB_OUTPUT
        else
          echo "❗No renv requirement found. Skipping..."
          echo "renv-exists=false" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Calculate renv hash
      id: set-renv-hash
      if: ${{ steps.check-for-renv.outputs.renv-exists == 'true' }}
      run: |
        # Calculating renv cache hashsum #
        CACHE_VERSION_INPUT="${{ inputs.CACHE_VERSION }}"
        if [[ -z "$CACHE_VERSION_INPUT" ]]; then
          echo "renv-cache-hashsum=${{ hashFiles('renv/profiles/lesson-requirements/renv.lock') }}" >> $GITHUB_OUTPUT
        else
          echo "renv-cache-hashsum=$CACHE_VERSION_INPUT" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: Get Container Version Used
      id: wb-vers
      if: ${{ steps.check-for-renv.outputs.renv-exists == 'true' }}
      uses: carpentries/actions/container-version@v1
      with:
        WORKBENCH_TAG: ${{ inputs.WORKBENCH_TAG || 'latest' }}
        renv-needed: ${{ steps.check-for-renv.outputs.renv-exists }}
        token: ${{ inputs.token || github.token }}

    - name: Resolve dependency image
      id: resolve-dependency-image
      env:
        WORKBENCH_TAG: ${{ inputs.WORKBENCH_TAG || 'latest' }}
        IMAGE_OWNER: ${{ github.repository_owner }}
        IMAGE_NAME: ${{ github.event.repository.name }}
        WB_VERSION: ${{ steps.wb-vers.outputs.container-version }}
        RENV_NEEDED: ${{ steps.check-for-renv.outputs.renv-exists }}
        RENV_HASH: ${{ steps.set-renv-hash.outputs.renv-cache-hashsum }}
      run: |
        set -euo pipefail

        base_image="ghcr.io/carpentries/workbench-docker:${WORKBENCH_TAG}"
        exact_image="ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}-deps:${WB_VERSION}_renv-${RENV_HASH}"

        # remember to lowercaseify image names
        if [[ "${RENV_NEEDED}" == "true" ]] && docker manifest inspect "${exact_image,,}" >/dev/null 2>&1; then
          echo "dependency-image-ref=${exact_image,,}" >> "$GITHUB_OUTPUT"
          echo "dependency-image-available=true" >> "$GITHUB_OUTPUT"
        else
          echo "dependency-image-ref=${base_image,,}" >> "$GITHUB_OUTPUT"
          echo "dependency-image-available=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: "Debug output"
      run: |
        # 💡 Debug renv cache output #
        echo "renv-needed: ${{ steps.check-for-renv.outputs.renv-exists }}"
        echo "renv-cache-hashsum: ${{ steps.set-renv-hash.outputs.renv-cache-hashsum }}"
        echo "dependency-image-ref: ${{ steps.resolve-dependency-image.outputs.dependency-image-ref }}"
        echo "dependency-image-available: ${{ steps.resolve-dependency-image.outputs.dependency-image-available }}"
      shell: bash
